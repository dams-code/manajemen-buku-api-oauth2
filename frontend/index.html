<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Buku (FastAPI)</title>
    <link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/cek_token.js"></script>

    <style>
        .batas{
            border-top: 1px solid #ccc;
            margin-top: 30px;
            padding-top: 5px;
        }

        .navbar-brand p:last-child{
            font-size: 0.815rem;
        }
    </style>

</head>

<body style="background-color: #fff;">

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid" style="border-bottom: 1px solid #1b1b1b;">
            <div class="navbar-brand">
                <p class="fs-2 m-0">Manajemen Buku sederhana</p>
                <p class="text-start fw-light m-0">@2026 Damar Djati Wahyu Kemala</p>
            </div>
            
            
            <ul class="nav nav-tabs">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle d-flex gap-2 align-items-center" data-bs-toggle="dropdown" role="button" aria-expanded="false" href="javascript:void(0);">
                        <span id="userAktif"></span>
                        <span id="userRoleAktif" class="badge bg-secondary"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="javascript:void(0)">Edit User</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button class="dropdown-item text-danger" type="button" onclick="logout();" >
                                Logout
                            </button>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="row col-md-12 mt-3">

            <div class="text-end mb-3">
                <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#modalbuku" onclick="setTambahBuku();">
                    <i class="bi bi-journal-plus"></i> Tambah Buku
                </button>
            </div>

            <table class="table table-light table-stripped text-center shadow p-3 mb-5 bg-body-tertiary rounded">
                <thead>
                    <th>id</th>
                    <th>Judul</th>
                    <th>Penulis</th>
                    <th>Tahun</th>
                    <th>Genre</th>
                    <th>Tersedia</th>
                    <th>Aksi</th>
                    <th>Set Status</th>
                </thead>
                <tbody ID="dataBuku"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="modalbuku" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="modalJudul"></h1>
                </div>
                <div class="modal-body">
                    <form method="post">
                        <div class="d-grid row-gap-3">
                            <div class="row align-items-center" id="hide-id-tambah-buku">
                                <div class="col-2">
                                    <label for="id" class="col-form-label">Id</label>
                                </div>
                                <div class="col-auto">
                                    <input type="number" class="form-control" id="id" disabled="true" value="">
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="judul" class="col-form-label">judul</label>
                                </div>
                                <div class="col-auto">
                                    <input type="text" id="judul" class="form-control"/>
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="penulis" class="col-form-label">Penulis</label>
                                </div>
                                <div class="col-auto">
                                    <input type="text" id="penulis" class="form-control"/>
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="tahun" class="col-form-label">Tahun</label>
                                </div>
                                <div class="col-3">
                                    <input type="number" min="1000" max="9999" maxlength="4" class="form-control" id="tahun"/>
                                </div>
                            </div>
                            <div class="row align-items-center">
                                <div class="col-2">
                                    <label for="genre" class="col-form-label">Genre</label>
                                </div>
                                <div class="col-auto">
                                    <select class="form-select" id="list_genre">
                                        <option value="" selected>Pilih genre</option>
                                        <option value="edukasi">Edukasi</option>
                                        <option value="novel">Novel</option>
                                        <option value="fantasty">Fantasty</option>
                                        <option value="anak">Anak-anak</option>
                                        <option value="self-improvement">Self Improvement</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row align-items-center" style="display: none;">
                                <div class="col-2">
                                    <label for="tersedia" class="col-form-label">Tersedia</label>
                                </div>
                                <div class="col-auto">
                                    <select class="form-select" id="list_tersedia">
                                        <option value="" selected>Pilih</option>
                                        <option value="true">Tersedia</option>
                                        <option value="false">Tidak tersedia</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary" onclick="simpan_buku();">Simpan</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="batas"></div>

    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sesi_user_aktif.js"></script>
    <script src="js/buku.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
